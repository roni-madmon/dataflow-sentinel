version: 2

models:
  - name: ml_job_features_v2
    description: >
      Experimental job features including instance counts and task types.
      Their availability before job start is an assumption requiring validation.

    columns:
      - name: job_run_id
        data_tests:
          - not_null
          - unique

      - name: task_type_group
        data_tests:
          - not_null
          